version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix(deps)
    groups:
      go-modules:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        update-types: [minor, patch]

  # The TypeScript MCP SDK used by the conformance test. Newer SDKs can be
  # stricter, so updates are worth testing as they come.
  - package-ecosystem: npm
    directory: /test/conformance
    schedule:
      interval: weekly
    commit-message:
      prefix: test(deps)

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix(deps)
