name: PR title

# Pull requests are squash-merged, so the title becomes the commit message
# Release Please reads. Require it to be a Conventional Commit.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commit format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|revert|docs|style|refactor|test|build|ci|chore|deps)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title \"$TITLE\" is not a Conventional Commit, e.g. \"feat: add fgt_ospf_neighbors tool\" or \"fix(policy): keep order when moving\". See CONTRIBUTING.md."
            exit 1
          fi
