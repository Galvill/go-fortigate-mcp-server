# Release with: git tag vX.Y.Z && git push --tags (see .github/workflows/release.yml).
# Dry run locally: goreleaser release --snapshot --clean
version: 2

project_name: fortigate-mcp

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: fortigate-mcp
    main: ./cmd/fortigate-mcp
    binary: fortigate-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - docs/TOOLS.md

checksum:
  name_template: checksums.txt

# SPDX SBOM per archive, generated with syft.
sboms:
  - artifacts: archive

# Keyless signing of the checksum file (which covers every archive and SBOM)
# through Sigstore, using the GitHub Actions OIDC identity.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "--yes", "${artifact}"]

dockers_v2:
  - id: image
    images:
      - ghcr.io/galvill/go-fortigate-mcp-server
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    dockerfile: Dockerfile.goreleaser
    platforms: [linux/amd64, linux/arm64]
    sbom: true
    labels:
      org.opencontainers.image.title: fortigate-mcp
      org.opencontainers.image.description: MCP server for FortiGate firewalls
      org.opencontainers.image.source: '{{ trimsuffix .GitURL ".git" }}'
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.licenses: MIT

docker_signs:
  - cmd: cosign
    artifacts: images
    args: ["sign", "--yes", "${artifact}@${digest}"]

changelog:
  disable: true # release notes come from CHANGELOG.md

release:
  prerelease: auto
