# nginx in front of fortigate-mcp: TLS, a bearer token per client, and the
# client's name passed on for the audit log. Put this file in
# /etc/nginx/conf.d/ (it is included in the http block).
#
# Run the server on loopback, recording the identity nginx sets:
#   fortigate-mcp -transport http -http-addr 127.0.0.1:8080 \
#     -audit-identity-header X-Forwarded-User
#
# Generate each client's token with: openssl rand -hex 32
# Clients then send it, e.g. for Claude Code:
#   claude mcp add --transport http fortigate https://mcp.example.com/mcp \
#     --header "Authorization: Bearer <token>"

# Map each client's token to a name; unknown or missing tokens map to "".
map $http_authorization $mcp_user {
    default                                  "";
    "Bearer REPLACE-WITH-ALICE-TOKEN"        alice;
    "Bearer REPLACE-WITH-AUTOMATION-TOKEN"   automation;
}

server {
    listen 443 ssl;
    server_name mcp.example.com;

    ssl_certificate     /etc/nginx/tls/mcp.example.com.crt;
    ssl_certificate_key /etc/nginx/tls/mcp.example.com.key;

    location = /mcp {
        if ($mcp_user = "") {
            add_header WWW-Authenticate 'Bearer realm="fortigate-mcp"' always;
            return 401;
        }

        proxy_pass http://127.0.0.1:8080;
        # Leave Host as nginx's default ($proxy_host, i.e. 127.0.0.1:8080):
        # the server rejects loopback requests whose Host isn't local, which
        # protects it against DNS rebinding.

        # Overwrite, never append to, whatever the client sent.
        proxy_set_header X-Forwarded-User $mcp_user;
        proxy_set_header Authorization "";

        # Streamable HTTP answers with server-sent events: don't buffer them,
        # and keep long-lived streams open.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Health checks and metrics stay reachable only from the host itself.
    location / {
        return 404;
    }
}
